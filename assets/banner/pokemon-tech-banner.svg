<svg xmlns="http://www.w3.org/2000/svg" width="720" height="80" viewBox="0 0 720 80" role="img" aria-labelledby="title desc">
  <title id="title">Perfil profesional de Frank con Pokémon</title>
  <desc id="desc">Banner animado con Pikachu, Charmander, Squirtle y Bulbasaur presentando el perfil Full Stack de Frank.</desc>
  <style>
    :root { --bg: #ffffff; --border: #d8b4fe; --name: #6a0572; --text: #24292f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --border: #6a0572; --name: #c084fc; --text: #f0f6fc; }
    }
    .frame { fill: var(--bg); stroke: var(--border); stroke-width: 2; }
    .scene { opacity: 0; animation: scene 16s ease-in-out infinite; }
    .scene-2 { animation-delay: 4s; }
    .scene-3 { animation-delay: 8s; }
    .scene-4 { animation-delay: 12s; }
    .sprite { image-rendering: pixelated; }
    .pokemon { fill: var(--name); font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .message { fill: var(--text); font: 600 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes scene {
      0% { opacity: 0; transform: translateX(10px); }
      3%, 22% { opacity: 1; transform: translateX(0); }
      25%, 100% { opacity: 0; transform: translateX(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene { animation: none; opacity: 0; }
      .scene-1 { opacity: 1; }
    }
  </style>
  <rect class="frame" x="1" y="1" width="718" height="78" rx="14"/>

  <g class="scene scene-1">
    <image href="data:image/png;base64," x="20" y="4" width="72" height="72" class="sprite"/>
    <text x="108" y="32" class="pokemon">Pikachu</text>
    <text x="108" y="56" class="message">Full Stack Developer · Backend Focus</text>
  </g>
  <g class="scene scene-2">
    <image href="data:image/png;base64," x="20" y="4" width="72" height="72" class="sprite"/>
    <text x="108" y="32" class="pokemon">Charmander</text>
    <text x="108" y="56" class="message">NestJS · TypeScript · PostgreSQL</text>
  </g>
  <g class="scene scene-3">
    <image href="data:image/png;base64," x="20" y="4" width="72" height="72" class="sprite"/>
    <text x="108" y="32" class="pokemon">Squirtle</text>
    <text x="108" y="56" class="message">APIs REST · SaaS · Integraciones</text>
  </g>
  <g class="scene scene-4">
    <image href="data:image/png;base64," x="20" y="4" width="72" height="72" class="sprite"/>
    <text x="108" y="32" class="pokemon">Bulbasaur</text>
    <text x="108" y="56" class="message">Open to Remote Opportunities</text>
  </g>
</svg>
